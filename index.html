<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNNY x Uber Eats | 1000.ver 旗艦官網</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;800&family=Playfair+Display:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root { --ue-green: #06C167; --dark: #000000; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--dark); color: #fff; overflow-x: hidden; }
        .serif { font-family: 'Playfair Display', serif; }

        /* 1000分：強制強化版綠光流 */
        .hero-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: #000;
        }
        .light-stream {
            position: absolute; width: 100vw; height: 100vw;
            /* 提高透明度與擴散範圍 */
            background: radial-gradient(circle, rgba(6, 193, 103, 0.15) 0%, rgba(6, 193, 103, 0.05) 30%, transparent 70%);
            border-radius: 50%; 
            animation: move-stream 20s infinite alternate cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }
        .light-stream-2 {
            position: absolute; width: 80vw; height: 80vw;
            background: radial-gradient(circle, rgba(6, 193, 103, 0.1) 0%, transparent 60%);
            border-radius: 50%;
            bottom: -10%; right: -10%;
            animation: move-stream 15s infinite alternate-reverse cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }
        @keyframes move-stream {
            0% { transform: translate(-20%, -20%) scale(1); opacity: 0.3; }
            50% { opacity: 0.7; }
            100% { transform: translate(20%, 20%) scale(1.3); opacity: 0.4; }
        }

        /* 玻璃擬態卡片強化 */
        .ue-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(50px) saturate(200%);
            -webkit-backdrop-filter: blur(50px) saturate(200%);
            border: 1px solid rgba(6, 193, 103, 0.2);
            border-radius: 56px;
            transition: all 0.8s ease;
        }

        /* 標題發光效果強化 */
        .glow-text {
            background: linear-gradient(135deg, #fff 50%, var(--ue-green) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(6, 193, 103, 0.4));
        }

        .btn-glow {
            box-shadow: 0 0 30px rgba(6, 193, 103, 0.3);
            transition: all 0.5s ease;
        }
        .btn-glow:hover { box-shadow: 0 0 50px rgba(6, 193, 103, 0.6); }
    </style>
</head>
<body>
    <div class="hero-bg">
        <div class="light-stream"></div>
        <div class="light-stream-2"></div>
    </div>

    <nav class="fixed w-full z-[100] py-8 px-10 flex justify-between items-center backdrop-blur-lg">
        <div class="flex items-center gap-4">
            <span class="text-white font-black tracking-tighter text-2xl">Uber <span class="text-[#06C167]">Eats</span></span>
            <span class="text-[10px] tracking-[0.4em] uppercase opacity-60 font-bold ml-4">Sunny Strategy</span>
        </div>
        <a href="https://line.me/ti/p/xd__vmNemf" target="_blank" class="bg-[#06C167] text-white px-8 py-3 rounded-full text-xs font-black tracking-widest btn-glow">免費諮詢</a>
    </nav>

    <section class="min-h-screen flex items-center justify-center px-6 pt-20">
        <div class="max-w-7xl w-full grid md:grid-cols-2 gap-20 items-center">
            <div data-aos="fade-right">
                <p class="text-[#06C167] font-bold tracking-[0.5em] text-[10px] uppercase mb-8">台中 | 彰化 | 花蓮 策略中心</p>
                <h1 class="serif text-[5rem] md:text-[9rem] leading-[0.8] italic font-black mb-12 glow-text">
                    Beyond <br> <span class="text-white">Delivery.</span>
                </h1>
                <p class="text-gray-400 text-xl md:text-2xl mb-16 max-w-md leading-relaxed font-light">
                    透過<span class="text-white font-bold">數據美學</span>與市場心理，我們在數位世界為您重建品牌帝國。
                </p>
                <a href="https://line.me/ti/p/xd__vmNemf" target="_blank" class="bg-[#06C167] text-white px-14 py-6 rounded-full font-black text-sm tracking-[0.3em] inline-block">開啟爆單計畫</a>
            </div>

            <div class="relative group" data-aos="zoom-out">
                <div class="ue-glass overflow-hidden relative" style="height: 600px;">
                    <img src="https://i.postimg.cc/QKhwt7wM/Screenshot-20260506-003930-LINE-2.jpg" alt="Sunny" class="w-full h-full object-cover grayscale-[0.2] hover:grayscale-0 transition-all duration-1000">
                    <div class="absolute bottom-12 left-12 text-white">
                        <p class="serif italic text-6xl mb-2">Sunny</p>
                        <p class="text-[#06C167] font-bold tracking-[0.5em] text-[10px]">ELITE STRATEGIC DIRECTOR</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="fixed bottom-12 right-12 z-[1000] flex flex-col gap-8">
        <a href="https://www.instagram.com/sunny.07.04/" target="_blank" class="w-16 h-16 ue-glass flex items-center justify-center rounded-full text-white hover:text-[#06C167] transition-all">
            <i class="fa-brands fa-instagram text-2xl"></i>
        </a>
        <a href="https://line.me/ti/p/xd__vmNemf" target="_blank" class="w-24 h-24 bg-[#06C755] rounded-full flex items-center justify-center text-white shadow-2xl hover:scale-110 active:scale-95 transition-all">
            <i class="fa-brands fa-line text-5xl"></i>
        </a>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ duration: 1500, once: true });</script>
</body>
</html>
