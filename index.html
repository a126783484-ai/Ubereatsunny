<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNNY STRATEGY | Uber Eats 旗艦策略顧問</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;800&family=Playfair+Display:ital,wght@0,900;1,900&family=Noto+Sans+TC:wght@300;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root { --ue-green: #06C167; --bg-dark: #000000; }
        body { 
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; 
            background: var(--bg-dark); 
            color: #fff; 
            overflow-x: hidden;
            letter-spacing: -0.01em;
        }
        .serif { font-family: 'Playfair Display', serif; }

        /* 1000分：超強感知光流背景系統 */
        .aurora-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: #000; overflow: hidden;
        }
        /* 第一道光：深層流動 */
        .aurora-1 {
            position: absolute; width: 120vw; height: 120vw;
            top: -20%; left: -30%;
            background: radial-gradient(circle at center, rgba(6, 193, 103, 0.18) 0%, transparent 60%);
            border-radius: 45%;
            animation: rotate-aurora 25s infinite linear;
            filter: blur(80px);
        }
        /* 第二道光：亮部擴散 */
        .aurora-2 {
            position: absolute; width: 100vw; height: 100vw;
            bottom: -30%; right: -20%;
            background: radial-gradient(circle at center, rgba(6, 193, 103, 0.12) 0%, transparent 55%);
            border-radius: 40%;
            animation: rotate-aurora 18s infinite linear reverse;
            filter: blur(100px);
        }
        @keyframes rotate-aurora {
            from { transform: rotate(0deg) scale(1); }
            to { transform: rotate(360deg) scale(1.2); }
        }

        /* 重構：流光邊框卡片 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(6, 193, 103, 0.25);
            border-radius: 50px;
            position: relative;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-panel:hover {
            border-color: var(--ue-green);
            transform: translateY(-15px) rotateX(2deg);
            box-shadow: 0 40px 100px rgba(6, 193, 103, 0.15);
        }

        /* 標題渲染增強 */
        .glow-title {
            background: linear-gradient(135deg, #fff 40%, var(--ue-green) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(6, 193, 103, 0.35));
        }

        /* 呼吸動畫 */
        .pulse-btn {
            box-shadow: 0 0 0 0 rgba(6, 193, 103, 0.4);
            animation: pulse-ue 2s infinite;
        }
        @keyframes pulse-ue {
            0% { box-shadow: 0 0 0 0 rgba(6, 193, 103, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(6, 193, 103, 0); }
            100% { box-shadow: 0 0 0 0 rgba(6, 193, 103, 0); }
        }
    </style>
</head>
<body>

    <footer class="py-40 border-t border-white/5 text-center">

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1500, once: true, easing: 'ease-out-quint' });
        // 增加視差滾動效果
        window.addEventListener('scroll', () => {
            const scrolled = window.pageYOffset;
            document.querySelector('.aurora-1').style.transform = `rotate(${scrolled * 0.1}deg) scale(${1 + scrolled * 0.0005})`;
            document.querySelector('.aurora-2').style.transform = `rotate(-${scrolled * 0.15}deg) scale(${1 + scrolled * 0.0005})`;
        });
    </script>
</body>
</html>
