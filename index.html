    <style>
        :root { --green: #06C167; --off-white: #FAFAFA; }
        body { font-family: 'DM Sans', sans-serif; background: var(--off-white); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        .serif { font-family: 'DM Serif Display', serif; letter-spacing: -0.01em; }
        
        /* 極光背景動畫 */
        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(6, 193, 103, 0.1) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(6, 193, 103, 0.08) 0%, transparent 40%);
            animation: aurora 15s ease-in-out infinite alternate;
        }
        @keyframes aurora { 0% { transform: scale(1); } 100% { transform: scale(1.1) translate(2%, 2%); } }

        /* 玻璃擬態 */
        .glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 32px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); }

        /* Line 呼吸按鈕 */
        .breath-btn { animation: pulse-green 2s infinite; }
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(6, 199, 85, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(6, 199, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(6, 199, 85, 0); }
        }
    </style>
</head>
